
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7565e8">
<title>MySpace — Notes & Tasks</title>

<style>
:root {
  --bg:#f5f5fa;
  --card:#ffffff;
  --text:#24233a;
  --muted:#9291a5;
  --primary:#7565e8;
  --border:#e9e8f0;
  --green:#20b486;
  --red:#e76b78;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea {font:inherit}
button {cursor:pointer}
.app {max-width:680px;margin:auto;padding:20px}
header {
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:24px;
}
.brand {font-size:25px;font-weight:800;letter-spacing:-1px}
.brand span {color:var(--primary)}
.icon-btn {
  border:1px solid var(--border);
  background:var(--card);color:var(--text);
  border-radius:12px;padding:10px 13px;
}
.greeting {margin-bottom:22px}
.greeting h1 {font-size:27px;margin:0 0 7px}
.greeting p {color:var(--muted);margin:0}
.stats {
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-bottom:22px;
}
.stat {
  background:var(--card);padding:16px 12px;
  border:1px solid var(--border);border-radius:17px;
}
.stat strong {display:block;font-size:24px;margin-bottom:5px}
.stat small {color:var(--muted);font-size:12px}
.tabs {
  display:flex;gap:8px;margin-bottom:16px;
  background:var(--card);padding:6px;
  border:1px solid var(--border);border-radius:14px;
}
.tab {
  flex:1;border:0;background:transparent;
  color:var(--muted);padding:11px 5px;
  border-radius:10px;font-weight:600;
}
.tab.active {background:var(--primary);color:white}
.toolbar {
  display:flex;gap:9px;margin-bottom:16px;
}
.search {
  flex:1;min-width:0;padding:13px;
  border:1px solid var(--border);border-radius:12px;
  background:var(--card);color:var(--text);outline:none;
}
.add-btn {
  background:var(--primary);color:white;border:0;
  padding:0 17px;border-radius:12px;font-weight:700;
}
.section-title {
  font-size:16px;font-weight:750;margin:20px 0 12px;
}
.item {
  background:var(--card);border:1px solid var(--border);
  border-radius:15px;padding:16px;margin-bottom:11px;
}
.item-top {display:flex;justify-content:space-between;gap:10px}
.item h3 {font-size:15px;margin:0 0 8px;overflow-wrap:anywhere}
.item p {
  color:var(--muted);font-size:13px;line-height:1.6;
  margin:0;white-space:pre-wrap;overflow-wrap:anywhere;
}
.item-actions {display:flex;gap:7px;flex-shrink:0}
.small-btn {
  background:var(--bg);border:0;border-radius:8px;
  padding:7px 9px;color:var(--text);
}
.tag {
  display:inline-block;margin-top:12px;padding:5px 9px;
  background:#f0edff;color:var(--primary);
  border-radius:20px;font-size:11px;font-weight:700;
}
.task-row {display:flex;align-items:flex-start;gap:11px}
.task-check {width:19px;height:19px;accent-color:var(--primary);margin-top:2px}
.task-content {flex:1;min-width:0}
.done h3 {text-decoration:line-through;color:var(--muted)}
.empty {
  text-align:center;padding:42px 15px;
  color:var(--muted);background:var(--card);
  border:1px dashed var(--border);border-radius:16px;
}
.empty div {font-size:35px;margin-bottom:12px}
.modal {
  display:none;position:fixed;inset:0;
  background:#0008;z-index:5;
  align-items:center;justify-content:center;padding:16px;
}
.modal.show {display:flex}
.modal-box {
  width:100%;max-width:480px;background:var(--card);
  border-radius:20px;padding:22px;
  max-height:90vh;overflow:auto;
}
.modal-box h2 {margin:0 0 18px}
.field {margin-bottom:14px}
.field label {
  display:block;font-size:13px;font-weight:650;margin-bottom:7px;
}
.field input,.field textarea,.field select {
  width:100%;padding:12px;border:1px solid var(--border);
  border-radius:10px;background:var(--bg);color:var(--text);
  outline:none;
}
.field textarea {min-height:120px;resize:vertical}
.modal-actions {display:flex;gap:10px;margin-top:18px}
.modal-actions button {
  flex:1;padding:13px;border-radius:11px;border:0;font-weight:700;
}
.save {background:var(--primary);color:white}
.cancel {background:var(--bg);color:var(--text)}
footer {text-align:center;color:var(--muted);font-size:12px;padding:25px 0}
body.dark {
  --bg:#151522;--card:#222232;--text:#f2f1fa;
  --muted:#a5a4b8;--border:#343447;
}
body.dark .tag {background:#38304f;color:#c5baff}
@media(max-width:380px) {
  .app {padding:14px}
  .stat {padding:13px 9px}
  .stat strong {font-size:21px}
  .tab {font-size:12px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">My<span>Space</span> ✦</div>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
</header>

<section class="greeting">
  <h1 id="greeting">Welcome back!</h1>
  <p>Your personal space to think, plan and grow.</p>
</section>

<section class="stats">
  <div class="stat"><strong id="noteCount">0</strong><small>Total Notes</small></div>
  <div class="stat"><strong id="pendingCount">0</strong><small>Pending Tasks</small></div>
  <div class="stat"><strong id="doneCount">0</strong><small>Completed</small></div>
</section>

<nav class="tabs">
  <button class="tab active" data-tab="all">Overview</button>
  <button class="tab" data-tab="notes">Notes</button>
  <button class="tab" data-tab="tasks">Tasks</button>
</nav>

<div class="toolbar">
  <input class="search" id="search" placeholder="🔍 Search notes and tasks..." oninput="render()">
  <button class="add-btn" id="addBtn" onclick="openModal()">+ Add</button>
</div>

<div id="content"></div>

<footer>Made for your thoughts, plans and everyday progress. ✦</footer>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Create new item</h2>
    <form id="itemForm">
      <div class="field">
        <label>Type</label>
        <select id="itemType">
          <option value="note">Note</option>
          <option value="task">Task</option>
        </select>
      </div>
      <div class="field">
        <label>Title</label>
        <input id="itemTitle" maxlength="100" required placeholder="Give it a title...">
      </div>
      <div class="field">
        <label>Details</label>
        <textarea id="itemBody" placeholder="Write something..."></textarea>
      </div>
      <div class="field" id="categoryField">
        <label>Category</label>
        <select id="itemCategory">
          <option>Personal</option>
          <option>Work</option>
          <option>Study</option>
          <option>Ideas</option>
          <option>Important</option>
        </select>
      </div>
      <div class="field" id="dateField">
        <label>Due date</label>
        <input type="date" id="itemDate">
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="save">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let items = [];
try {
  items = JSON.parse(localStorage.getItem("myspace-items") || "[]");
  if (!Array.isArray(items)) items = [];
} catch(e) { items = []; }

let activeTab = "all";
let editingId = null;

function persist() {
  localStorage.setItem("myspace-items", JSON.stringify(items));
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  localStorage.setItem("myspace-theme", dark ? "dark" : "light");
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
}

if (localStorage.getItem("myspace-theme") === "dark") {
  document.body.classList.add("dark");
  $("themeBtn").textContent = "☀️";
}

const hour = new Date().getHours();
$("greeting").textContent =
  hour < 12 ? "Good morning!" :
  hour < 17 ? "Good afternoon!" : "Good evening!";

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    activeTab = button.dataset.tab;
    document.querySelectorAll(".tab").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    $("addBtn").textContent =
      activeTab === "notes" ? "+ Note" :
      activeTab === "tasks" ? "+ Task" : "+ Add";
    render();
  });
});

function openModal(id = null) {
  editingId = id;
  const item = items.find(x => x.id === id);
  $("itemForm").reset();

  if (item) {
    $("itemType").value = item.type;
    $("itemTitle").value = item.title;
    $("itemBody").value = item.body || "";
    $("itemCategory").value = item.category || "Personal";
    $("itemDate").value = item.date || "";
  } else {
    $("itemType").value =
      activeTab === "tasks" ? "task" : "note";
  }

  $("modalTitle").textContent =
    item ? "Edit item" : "Create new item";
  updateFields();
  $("modal").classList.add("show");
}

function closeModal() {
  $("modal").classList.remove("show");
}

function updateFields() {
  const task = $("itemType").value === "task";
  $("dateField").style.display = task ? "block" : "none";
  $("categoryField").style.display = task ? "none" : "block";
}

$("itemType").addEventListener("change", updateFields);

$("itemForm").addEventListener("submit", e => {
  e.preventDefault();

  const data = {
    type: $("itemType").value,
    title: $("itemTitle").value.trim(),
    body: $("itemBody").value.trim(),
    category: $("itemCategory").value,
    date: $("itemDate").value
  };

  if (!data.title) return;

  if (editingId) {
    const item = items.find(x => x.id === editingId);
    if (item) Object.assign(item, data);
  } else {
    items.unshift({
      id: Date.now().toString(),
      ...data,
      done: false,
      created: new Date().toISOString()
    });
  }

  persist();
  closeModal();
  render();
});

function editItem(id) {
  openModal(id);
}

function deleteItem(id) {
  if (!confirm("Are you sure you want to delete this item?")) return;
  items = items.filter(x => x.id !== id);
  persist();
  render();
}

function toggleTask(id) {
  const item = items.find(x => x.id === id);
  if (item) item.done = !item.done;
  persist();
  render();
}

function emptyState(message) {
  return `<div class="empty"><div>✦</div>${message}</div>`;
}

function render() {
  const notes = items.filter(x => x.type === "note");
  const tasks = items.filter(x => x.type === "task");

  $("noteCount").textContent = notes.length;
  $("pendingCount").textContent = tasks.filter(x => !x.done).length;
  $("doneCount").textContent = tasks.filter(x => x.done).length;

  const query = $("search").value.toLowerCase().trim();

  let visible = items.filter(x =>
    x.title.toLowerCase().includes(query) ||
    (x.body || "").toLowerCase().includes(query)
  );

  if (activeTab === "notes") visible = visible.filter(x => x.type === "note");
  if (activeTab === "tasks") visible = visible.filter(x => x.type === "task");

  if (!visible.length) {
    $("content").innerHTML = emptyState(
      query ? "No matching results found." :
      "Your space is empty. Tap + Add to get started."
    );
    return;
  }

  const noteItems = visible.filter(x => x.type === "note");
  const taskItems = visible.filter(x => x.type === "task");

  let html = "";

  if (noteItems.length) {
    html += `<h2 class="section-title">📝 Your Notes</h2>`;
    html += noteItems.map(item => `
      <article class="item">
        <div class="item-top">
          <div style="min-width:0">
            <h3>${escapeHTML(item.title)}</h3>
            <p>${escapeHTML(item.body)}</p>
            <span class="tag">${escapeHTML(item.category || "Personal")}</span>
          </div>
          <div class="item-actions">
            <button class="small-btn" onclick="editItem('${item.id}')">✏️</button>
            <button class="small-btn" onclick="deleteItem('${item.id}')">🗑️</button>
          </div>
        </div>
      </article>
    `).join("");
  }

  if (taskItems.length) {
    html += `<h2 class="section-title">✓ Your Tasks</h2>`;
    html += taskItems.map(item => `
      <article class="item">
        <div class="task-row">
          <input class="task-check" type="checkbox"
            ${item.done ? "checked" : ""}
            onchange="toggleTask('${item.id}')">
          <div class="task-content ${item.done ? "done" : ""}">
            <div class="item-top">
              <div style="min-width:0">
                <h3>${escapeHTML(item.title)}</h3>
                <p>${escapeHTML(item.body)}</p>
                ${item.date ? `<span class="tag">📅 ${escapeHTML(item.date)}</span>` : ""}
              </div>
              <div class="item-actions">
                <button class="small-btn" onclick="editItem('${item.id}')">✏️</button>
                <button class="small-btn" onclick="deleteItem('${item.id}')">🗑️</button>
              </div>
            </div>
          </div>
        </div>
      </article>
    `).join("");
  }

  $("content").innerHTML = html;
}

$("modal").addEventListener("click", e => {
  if (e.target === $("modal")) closeModal();
});

render();
</script>
</body>
</html>
